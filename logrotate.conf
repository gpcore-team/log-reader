# ═══════════════════════════════════════════════════════════════════════════
#  Logrotate config for GPCORE Log Reader
#
#  Installed by install.sh --with-logrotate to /etc/logrotate.d/log-reader.
#  Placeholder @INSTALL_DIR@ is replaced with the actual install path.
# ═══════════════════════════════════════════════════════════════════════════

@INSTALL_DIR@/log/*.log {
    weekly
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    su USER GROUP
}
